<header>
    <div class="header-left">
      <div class="logo-icon">
        <img src="/data/Image/logo.png" alt="logo" />
    </div>
    <div class="title-block">
        <h1>TechStore</h1>
        <span>Informatique & High-Tech</span>
     </div>
    </div>
  

  
    <div class="search-bar">
        <input type="search" [(ngModel)]="query" placeholder="Rechercher..." (keyup.enter)="onSearch()"/>
        <button (click)="onSearch()"><span class="material-icons">search</span></button>
    </div>

    <div class="filters"> 
        <button class="arrow-btn" (click)="toggleMenu()" [class.open]="menuOpen">
            <span>Filtres</span>
            <span class="material-icons"></span>
          </button>
    </div>
  
    <div class="header-right">
        <button class="icon-btn" title="Favoris" routerLink="/favoris">
            <img src="/data/Image/favoris.png" alt="Favoris" />
        </button>
        <div class="avatar">
            <img src="/data/Image/compte.png" alt="compte" />
        </div>
    </div>
</header>
