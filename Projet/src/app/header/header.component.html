<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoL Top Lane Helper</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Roboto&display=swap" rel="stylesheet">
    
    <!-- Font Awesome-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS Global -->
    <link rel="stylesheet" href="header.component.html">

</head>

<body>


    <header>
        <img width= "10%" height="10%" src="/data/Image/Warwick_1.jpg" alt="Warwick"/>
        <h1>Vive Warwick</h1>

        <!-- Barre de recherche -->
        <div class="search-bar">
            <input type="search" [(ngModel)]="query" placeholder="Rechercher..." (keyup.enter)="onSearch()"/>
            <button (click)="onSearch()">🔍</button>
        </div>
        <a routerLink="/accueil">
            <img width= "10%" height="10%" src="/data/Image/favoris.png" alt="Favoris"/>
        </a>

    </header>
</body>
