<div class="container">

  <h2>Mes favoris</h2>

  <p *ngIf="favoris.length === 0">
    Aucun favori pour le moment.
  </p>

  <div class="grid">

    <div class="card" *ngFor="let pc of favoris; let i = index">

      <app-produit [nom]="pc"></app-produit>

      <button (click)="removeFavori(i)">
        Retirer
      </button>

    </div>

  </div>

</div>
