<div class="product-card">
    <img src="/data/Image/pc.jpg"
         alt="produit" />
    <div class="product-info">
      <span class="name">{{nom}}</span>
      <span class="price">{{prix}}€</span>
    </div>
    <button *ngIf="showFavButton" type="button" (click)="addToFavorite()">
        Mettre en favori
    </button>
  </div>
