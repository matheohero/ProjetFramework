<div class="product-card">
  <a href="./detail-produit/{{nom}}">
    <img src="/data/Image/Warwick_1.jpg"
         alt="produit" />
  </a>
    <div class="product-info">
      <span class="name">{{nom}}</span>
      <span class="price">{{prix}}€</span>
    </div>
    <button *ngIf="showFavButton" type="button" (click)="addToFavorite()">
        Mettre en favori
    </button>
  </div>
